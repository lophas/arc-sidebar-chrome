name: Check extension sources
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - run: python3 tests/browser-overlay.py --require-browser
