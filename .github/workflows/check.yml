name: Render Space palette proposals
on: [push]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - run: npx playwright-core install chromium --no-shell
      - run: xvfb-run -a node tests/preview-space-palettes.mjs
