name: Capture README screenshots
on:
  push:
    paths:
      - 'docs/screenshots/capture.mjs'
      - '.github/workflows/screenshots.yml'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - run: node docs/screenshots/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: docs/screenshots/generated/*.png
