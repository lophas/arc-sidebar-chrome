name: Capture README screenshots
on:
  workflow_dispatch:
  push:
    branches:
      - 'docs/readme-showcase-*'
    paths:
      - 'docs/screenshots/capture.mjs'
      - '.github/workflows/screenshots.yml'
      - 'docs/webstore/render.mjs'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      ARC_CAPTURE_WEBSTORE: ${{ contains(github.ref_name, 'webstore') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - run: npx playwright-core install chromium --no-shell
      - run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-noto-color-emoji ffmpeg openbox
      - run: |
          CAPTURE_HEIGHT=900
          if [ "$ARC_CAPTURE_WEBSTORE" = "1" ]; then CAPTURE_HEIGHT=800; fi
          xvfb-run -a -s "-screen 0 1280x${CAPTURE_HEIGHT}x24" bash -c 'openbox --sm-disable >/tmp/arc-openbox.log 2>&1 & node docs/screenshots/capture.mjs'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-screenshots
          path: |
            docs/screenshots/*.png
            docs/screenshots/capture-info.json
            docs/webstore/*.jpg
            docs/webstore/capture-info.json
      - name: Save refreshed screenshots on the documentation branch
        if: startsWith(github.ref, 'refs/heads/docs/readme-showcase-')
        run: |
          if [ "$ARC_CAPTURE_WEBSTORE" = "1" ]; then
            git add docs/webstore/*.jpg docs/webstore/capture-info.json
          else
            git add docs/screenshots/*.png docs/screenshots/capture-info.json
          fi
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh screenshots from the current extension'
            git push
          fi
