name: Build and publish extension release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag matches manifest release version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_RELEASE_VERSION="$(python3 -c 'import json; m=json.load(open("manifest.json")); print(m.get("version_name", m["version"]))')"
          if [[ "$TAG_VERSION" != "$MANIFEST_RELEASE_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match manifest release version ($MANIFEST_RELEASE_VERSION)." >&2
            exit 1
          fi

      - name: Build unpacked-extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_DIR="dist/arc-sidebar-chrome-v${VERSION}"
          ZIP_FILE="dist/arc-sidebar-chrome-v${VERSION}.zip"

          mkdir -p "$PACKAGE_DIR"
          cp manifest.json "$PACKAGE_DIR/"
          cp -R src "$PACKAGE_DIR/"

          (
            cd "$PACKAGE_DIR"
            zip -qr "../arc-sidebar-chrome-v${VERSION}.zip" manifest.json src
          )

          echo "Built $ZIP_FILE"
          unzip -l "$ZIP_FILE"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_FILE="dist/arc-sidebar-chrome-v${VERSION}.zip"
          EXTRA_ARGS=()
          if [[ "$VERSION" == *-* ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$ZIP_FILE" \
            --title "Arc Sidebar for Chrome ${VERSION}" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
