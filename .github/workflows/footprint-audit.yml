name: Footprint audit
on:
  push:
    branches: ['audit/footprint-*']
    paths: ['tools/footprint-audit.mjs']
  workflow_dispatch:
    inputs:
      scope:
        description: 'Measurement scope'
        type: choice
        default: full
        options: [full, lifecycle, ablation]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright-core@1.56.1
      - run: npx playwright-core install chromium --no-shell
      - run: xvfb-run -a node tools/footprint-audit.mjs
        env:
          AUDIT_SCOPE: ${{ inputs.scope || 'full' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-audit
          path: audit-results.json
