<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arc Side of the Chrome</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="manage.css">
  <link rel="stylesheet" href="item-icons.css">
  <link rel="stylesheet" href="space-icons.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="command-bar.css">
  <link rel="stylesheet" href="live-controls.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="app-title">Arc Side of the Chrome</div>
      <div id="stats" class="muted">No sidebar data</div>
    </div>
    <label class="import-button">
      Import from Arc Browser
      <input id="arcFile" type="file" accept="application/json,.json" hidden>
    </label>
  </header>

  <div class="search-wrap">
    <button id="toggleSidebarMode" type="button" class="sidebar-mode-toggle" aria-label="Switch sidebar mode" title="Switch sidebar mode">▣</button>
    <input id="search" type="hidden" value="">
    <button title="Search open tabs or enter a URL · ⌘K / Ctrl+K" aria-label="Search open tabs or enter a URL" id="openCommandBar" class="command-launch" type="button">Search or enter URL… <span>⌘K / Ctrl+K</span></button>
    <button id="addFavorite" class="add-favorite-button" type="button" title="Add Favorite" aria-label="Add Favorite">+</button>
  </div>

  <section id="favoritesSection" class="favorites-section hidden" aria-label="Favorites">
    <div id="favorites" class="favorites-drawer"></div>
  </section>

  <nav id="spaces" class="spaces" aria-label="Spaces"></nav>

  <main>
    <section id="pinnedSection">
      <div class="section-heading-row">
        <div class="section-title">Pinned</div>
        <div class="section-actions">
          <button id="addFolder" class="section-add-button folder-add-button" type="button" title="Add folder" aria-label="Add folder">▱</button>
          <button id="addPinned" class="section-add-button" type="button" title="Add pinned link" aria-label="Add pinned link">+</button>
        </div>
      </div>
      <div id="pinned"></div>
    </section>

    <section id="openSection" class="hidden">
      <div class="section-title">Open tabs <span id="openCount" class="muted"></span></div>
      <div id="openTabs"></div>
    </section>
  </main>

  <template id="emptyTemplate">
    <div class="empty-state">
      <strong>Build your sidebar</strong>
      <span>Use Add Favorite (+) beside Search, or Add pinned link (+) and Add folder (▱) above. Start organizing your links in 🚀 My Space.</span>
      <span>Right-click any webpage or link and choose <strong>Pin to Arc Side of the Chrome</strong> to save it to Favorites or a Space.</span>
      <span>Open <button type="button" class="empty-options-link">Sidebar Options</button> to import your Spaces, Favorites and icons from Arc Browser, restore an existing backup, or adjust your sidebar settings.</span>
    </div>
  </template>

  <script type="module" src="tooltips.js"></script>
  <script src="theme-sync.js"></script>
  <script type="module" src="lifecycle.js"></script>
  <script type="module" src="native-presence.js"></script>
  <script type="module" src="sidebar-mode.js"></script>
  <script type="module" src="index.js"></script>
  <script type="module" src="drag-scroll.js"></script>
  <script type="module" src="manage.js"></script>
  <script type="module" src="favorite-size.js"></script>
  <script type="module" src="item-icons.js"></script>
  <script type="module" src="folder-manage.js"></script>
  <script type="module" src="space-manage.js"></script>
  <script type="module" src="space-icons.js"></script>
  <script type="module" src="space-icons-extra.js"></script>
  <script type="module" src="emoji-search.js"></script>
  <script type="module" src="editor-presence.js"></script>
  <script type="module" src="space-dnd.js"></script>
  <script type="module" src="hierarchy-dnd.js"></script>
  <script type="module" src="root-drop.js"></script>
  <script type="module" src="space-tooltips.js"></script>
  <script type="module" src="link-title.js"></script>
  <script type="module" src="open-pin.js"></script>
  <script type="module" src="enter-save.js"></script>
  <script type="module" src="memory-controls.js"></script>
  <script type="module" src="scroll-memory.js"></script>
  <script type="module" src="command-bar.js"></script>
  <script type="module" src="workflow-pin-dnd.js"></script>
</body>
</html>
