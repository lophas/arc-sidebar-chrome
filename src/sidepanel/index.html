<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Arc Sidebar</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="manage.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="app-title">Arc Sidebar</div>
      <div id="stats" class="muted">No Arc data imported</div>
    </div>
    <label class="import-button">
      Import Arc
      <input id="arcFile" type="file" accept="application/json,.json" hidden>
    </label>
  </header>

  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search pinned and open tabs…" autocomplete="off">
    <button id="addFavorite" class="add-favorite-button" type="button" title="Add Favorite" aria-label="Add Favorite">+</button>
  </div>

  <section id="favoritesSection" class="favorites-section hidden" aria-label="Favorites">
    <div id="favorites" class="favorites-drawer"></div>
  </section>

  <nav id="spaces" class="spaces" aria-label="Spaces"></nav>

  <main>
    <section id="pinnedSection">
      <div class="section-heading-row">
        <div class="section-title">Pinned</div>
        <div class="section-actions">
          <button id="addFolder" class="section-add-button folder-add-button" type="button" title="Add folder" aria-label="Add folder">▱</button>
          <button id="addPinned" class="section-add-button" type="button" title="Add pinned link" aria-label="Add pinned link">+</button>
        </div>
      </div>
      <div id="pinned"></div>
    </section>

    <section id="openSection" class="hidden">
      <div class="section-title">Open tabs <span id="openCount" class="muted"></span></div>
      <div id="openTabs"></div>
    </section>
  </main>

  <template id="emptyTemplate">
    <div class="empty-state">
      <strong>No sidebar data</strong>
      <span>Open the extension's Options page to import Arc data.</span>
    </div>
  </template>

  <script src="theme-sync.js"></script>
  <script src="persistent-bindings.js"></script>
  <script type="module" src="native-presence.js"></script>
  <script type="module" src="index.js"></script>
  <script type="module" src="favorite-icons.js"></script>
  <script type="module" src="manage.js"></script>
  <script type="module" src="folder-manage.js"></script>
  <script type="module" src="space-manage.js"></script>
  <script type="module" src="space-dnd.js"></script>
  <script type="module" src="space-tooltips.js"></script>
  <script type="module" src="link-title.js"></script>
  <script type="module" src="open-pin.js"></script>
  <script type="module" src="enter-save.js"></script>
</body>
</html>
